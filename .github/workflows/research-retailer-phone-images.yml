name: Import authorized WhatMobile phone photos
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-retailer-phone-images.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: whatmobile-authorized-image-enrichment
  cancel-in-progress: false
jobs:
  discover:
    name: Exact-model scan shard \${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - name: Checkout pinned repository main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Test WhatMobile page matching, image types, robots and host rules
        run: |
          python -m unittest discover -s backend/scripts -p 'test_discover_retailer_phone_images.py'
          python -m unittest discover -s backend/scripts -p 'test_collect_whatmobile_media.py'
          python -m py_compile backend/scripts/merge_whatmobile_media.py
      - name: Collect actual images from WhatMobile only
        run: |
          mkdir -p shards
          python backend/scripts/collect_whatmobile_media.py backend/data/phones_import_ready.csv --output shards/whatmobile_media_\${{ matrix.shard }}.csv --start $(( \${{ matrix.shard }} * 750 )) --limit 750
      - name: Upload source-verified images
        uses: actions/upload-artifact@v4
        with:
          name: whatmobile-media-\${{ matrix.shard }}
          path: shards/whatmobile_media_\${{ matrix.shard }}.csv
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Commit source-verified manifest and additive image migration
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current repository main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Download all completed source manifests
        uses: actions/download-artifact@v4
        with:
          pattern: whatmobile-media-*
          path: shards
          merge-multiple: true
      - name: Validate model identity, publisher and exact image URLs
        run: |
          python backend/scripts/merge_whatmobile_media.py shards --output backend/data/whatmobile_media.csv --min-photos 5
          cp backend/scripts/whatmobile_media_migration_template.txt backend/catalog/migrations/0009_import_whatmobile_media.py
          python -m py_compile backend/catalog/migrations/0009_import_whatmobile_media.py
      - name: Commit media and one-time Django migration atomically
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/whatmobile_media.csv backend/catalog/migrations/0009_import_whatmobile_media.py
          if git diff --cached --quiet; then
            echo "WhatMobile media import is already committed."
          else
            git commit -m "Import exact-model authorized WhatMobile photos and documented colors"
            git push origin HEAD:main
          fi
