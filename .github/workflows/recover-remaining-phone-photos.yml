name: Recover remaining image-less phone cards
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-remaining-phone-photos.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: missing-photo-second-pass
  cancel-in-progress: false

jobs:
  scan:
    name: Extra photos ${{ matrix.brand }} shard ${{ matrix.part }}
    runs-on: ubuntu-latest
    timeout-minutes: 115
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        brand: [Apple, Google, Infinix, Itel, Motorola, Oppo, Samsung, Tecno, Vivo, Xiaomi]
        part: [0, 1]
    steps:
      - name: Checkout verified production missing-photo snapshot
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Check exact-model URL isolation
        run: |
          python -m unittest discover -s backend/scripts -p 'test_discover_more_brand_photos.py'
          python -m py_compile backend/scripts/discover_more_brand_photos.py backend/scripts/merge_more_brand_photos.py
      - name: Check alternate GSMArena CDN product photos using actual JPEG responses
        run: |
          mkdir -p shards
          brand=${{ matrix.brand }}
          lower=$(echo "$brand" | tr '[:upper:]' '[:lower:]')
          python backend/scripts/discover_more_brand_photos.py backend/data/phone_image_gap_2026_10_22.csv \
            --brand "$brand" --part ${{ matrix.part }} --parts 2 --output "shards/$lower-${{ matrix.part }}.csv"
      - name: Preserve evidence of both successes and absent source images
        uses: actions/upload-artifact@v4
        with:
          name: expanded-photo-${{ matrix.brand }}-${{ matrix.part }}
          path: shards/*.csv
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Commit only verified new images for image-less existing phones
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Recover all twenty source-verified reports
        uses: actions/download-artifact@v4
        with:
          pattern: expanded-photo-*
          merge-multiple: true
          path: shards
      - name: Quarantine identity mismatches and reused product photos
        run: |
          python -m unittest discover -s backend/scripts -p 'test_discover_more_brand_photos.py'
          python backend/scripts/merge_more_brand_photos.py shards backend/data/phone_image_gap_2026_10_22.csv \
            --parts 2 --min-images 1 --output backend/data/verified_brand_photos_second_pass.csv
      - name: Verify migration compiles and earlier migrations exist
        run: |
          test -f backend/catalog/migrations/0026_reuse_identical_model_product_images.py
          cp backend/scripts/brand_photo_second_pass_migration_template.txt \
            backend/catalog/migrations/0027_backfill_verified_remaining_phone_images.py
          python -m py_compile backend/catalog/migrations/0027_backfill_verified_remaining_phone_images.py
      - name: Publish only the manifest and additive migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/verified_brand_photos_second_pass.csv backend/catalog/migrations/0027_backfill_verified_remaining_phone_images.py
          if git diff --cached --quiet; then
            echo "Exact-model missing-photo import already published"
          else
            git commit -m "Add source-verified remaining phone images across all brands"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
