name: Live Render Chatbot Smoke Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/scripts/live_chat_smoke.py'
      - '.github/workflows/live-chat-smoke.yml'

permissions:
  contents: read

jobs:
  live-chatbot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Smoke-test live Render frontend and chatbot with disposable sessions
        run: python backend/scripts/live_chat_smoke.py
