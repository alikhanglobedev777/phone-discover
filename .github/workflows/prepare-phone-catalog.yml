name: Prepare 2020+ smartphone CSV
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phone Discover main
        uses: actions/checkout@v4
        with:
          ref: main
          path: phone-discover
          persist-credentials: true
      - name: Checkout upstream TechAPI dataset
        uses: actions/checkout@v4
        with:
          repository: GetTechAPI/TechAPI
          ref: develop
          path: techapi
          sparse-checkout: |
            data/smartphone
            data/LICENSE.md
      - name: Build source-attributed candidate CSV
        run: |
          cd phone-discover
          python backend/scripts/build_phone_csv.py ../techapi
          cp ../techapi/data/LICENSE.md backend/data/TECHAPI_LICENSE.md
      - name: Show CSV size and brand/model coverage
        run: |
          cd phone-discover
          python - <<'PY'
          import collections, csv
          from pathlib import Path
          path = Path("backend/data/phones_2020_onward.csv")
          with path.open(encoding="utf-8", newline="") as handle:
              rows = list(csv.DictReader(handle))
          brands = collections.Counter(row["brand"] for row in rows)
          models = {(row["brand"], row["device"]) for row in rows}
          print(f"Generated {len(rows)} variant rows, {len(models)} distinct model names.")
          print("Rows by brand:", dict(sorted(brands.items())))
          assert len(models) >= 100, "Too few catalog models; refusing to commit"
          PY
      - name: Test catalog audit rules
        run: |
          cd phone-discover
          python -m unittest discover -s backend/scripts -p 'test_audit_phone_catalog.py'
      - name: Audit candidate names, dates and memory (read-only)
        run: |
          cd phone-discover
          python backend/scripts/audit_phone_catalog.py backend/data/phones_2020_onward.csv --output backend/data/phones_catalog_audit.csv
      - name: Upload candidate and conflict report for review (no production changes)
        uses: actions/upload-artifact@v4
        with:
          name: phone-catalog-candidate
          path: |
            phone-discover/backend/data/phones_2020_onward.csv
            phone-discover/backend/data/phones_release_date_conflicts.csv
            phone-discover/backend/data/phones_catalog_audit.csv
            phone-discover/backend/data/TECHAPI_LICENSE.md
          if-no-files-found: error
