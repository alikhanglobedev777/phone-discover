name: Prepare 2020+ smartphone CSV
on:
  workflow_dispatch:
    inputs:
      ship_catalog:
        description: 'Commit clean catalog CSV to main for one-time Render import'
        type: boolean
        required: true
        default: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Phone Discover main
        uses: actions/checkout@v4
        with:
          ref: main
          path: phone-discover
          persist-credentials: true
      - name: Checkout upstream TechAPI dataset
        uses: actions/checkout@v4
        with:
          repository: GetTechAPI/TechAPI
          ref: db1dea0c38ff07fcf400aa05d8c8e4393348eb25
          path: techapi
          sparse-checkout: |
            data/smartphone
            data/LICENSE.md
      - name: Build source-attributed candidate CSV
        run: |
          cd phone-discover
          python backend/scripts/build_phone_csv.py ../techapi
          cp ../techapi/data/LICENSE.md backend/data/TECHAPI_LICENSE.md
          git -C ../techapi rev-parse HEAD > backend/data/TECHAPI_UPSTREAM_COMMIT.txt
      - name: Prepare conservative, conflict-tolerant import catalog
        run: |
          cd phone-discover
          python backend/scripts/prepare_production_catalog.py backend/data/phones_2020_onward.csv backend/data/phones_release_date_conflicts.csv --output backend/data/phones_import_ready.csv
      - name: Show CSV size and brand/model coverage
        run: |
          cd phone-discover
          python - <<'PY'
          import collections, csv
          from pathlib import Path
          path = Path("backend/data/phones_2020_onward.csv")
          with path.open(encoding="utf-8", newline="") as handle:
              rows = list(csv.DictReader(handle))
          brands = collections.Counter(row["brand"] for row in rows)
          models = {(row["brand"], row["device"]) for row in rows}
          print(f"Generated {len(rows)} variant rows, {len(models)} distinct model names.")
          print("Rows by brand:", dict(sorted(brands.items())))
          assert len(models) >= 100, "Too few catalog models; refusing to commit"
          PY
      - name: Test catalog audit rules
        run: |
          cd phone-discover
          python -m unittest discover -s backend/scripts -p 'test_audit_phone_catalog.py'
          python -m unittest discover -s backend/scripts -p 'test_build_phone_csv.py'
      - name: Audit candidate names, dates and memory (read-only)
        run: |
          cd phone-discover
          python backend/scripts/audit_phone_catalog.py backend/data/phones_2020_onward.csv --output backend/data/phones_catalog_audit.csv
      - name: Upload candidate and conflict report for review (no production changes)
        uses: actions/upload-artifact@v4
        with:
          name: phone-catalog-candidate
          path: |
            phone-discover/backend/data/phones_2020_onward.csv
            phone-discover/backend/data/phones_release_date_conflicts.csv
            phone-discover/backend/data/phones_catalog_audit.csv
            phone-discover/backend/data/phones_import_ready.csv
            phone-discover/backend/data/TECHAPI_LICENSE.md
            phone-discover/backend/data/TECHAPI_UPSTREAM_COMMIT.txt
          if-no-files-found: error
      - name: Commit only the curated CSV for Render (manual opt-in)
        if: ${{ inputs.ship_catalog }}
        run: |
          cd phone-discover
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/phones_import_ready.csv backend/data/TECHAPI_LICENSE.md backend/data/TECHAPI_UPSTREAM_COMMIT.txt
          if git diff --cached --quiet; then
            echo "Curated catalog unchanged."
          else
            git commit -m "Publish import-ready source-backed phone catalog for Render"
            git push origin HEAD:main
          fi
